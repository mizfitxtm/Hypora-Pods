[package]
name = "hypora-pods"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aap-protocol = { version = "0.1.0", path = "../aap-protocol" }
ble-adv = { version = "0.1.0", path = "../ble-adv" }
futures-util = "0.3.34"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
